name: Pre-commit

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - '.pre-commit-config.yaml'
      - '.github/workflows/pre-commit.yml'

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      
      - uses: actions/checkout@v7
        name: Checkout PR
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: |
            dashboard-service/pyproject.toml
            token-service/pyproject.toml
      
      - name: Check if pre-commit config exists
        id: check_precommit
        run: |
          if [ -f .pre-commit-config.yaml ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Install ruff
        if: steps.check_precommit.outputs.exists == 'true'
        run: |
          uv tool install ruff
      
      - name: Install pre-commit
        if: steps.check_precommit.outputs.exists == 'true'
        run: |
          uv tool install pre-commit
      
      - name: Run pre-commit
        if: steps.check_precommit.outputs.exists == 'true'
        id: precommit
        run: |
          pre-commit run --from-ref origin/${{ github.base_ref }} --to-ref HEAD --show-diff-on-failure
        continue-on-error: true
      
      - name: Commit and push changes
        if: steps.check_precommit.outputs.exists == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🎨 Auto format"
            git push
          fi
      
      - name: Error out on pre-commit errors
        if: steps.check_precommit.outputs.exists == 'true' && steps.precommit.outcome == 'failure'
        run: exit 1

  # https://github.com/marketplace/actions/alls-green#why
  pre-commit-alls-green:  # This job does nothing and is only used for the branch protection
    if: always()
    needs:
      - pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}